name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'Back-end/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'Back-end/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build and Run tests via Docker Compose
      run: |
        cd Back-end
        docker compose run --rm stag_io sh -c "python manage.py test"
